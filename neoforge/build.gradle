import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'com.gradleup.shadow'
    id 'net.darkhax.curseforgegradle'
    id 'com.modrinth.minotaur'
}
architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {

}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("neoforge")
}

assemble.dependsOn shadowJar

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}

tasks.register('copyResult', Copy) {
    from "${project.getProjectDir().toString()}/build/libs/${base.archivesName.get()}-${version}-neoforge.jar"
    into "${rootProject.getProjectDir().toString()}/build/libs/"
}
build.finalizedBy(copyResult);

def releaseDisplayName = "${minecraft_version}-${project.version}-neoforge"
def releaseChangelog = file("${rootProject.rootDir.path}/Changelog.md").text
def curseApiKey = project.findProperty("curseforge_apikey") ?: System.getenv("CF_API_KEY")
def modrinthToken = project.findProperty("modrinth_apikey") ?: System.getenv("MODRINTH_TOKEN")

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    dependsOn tasks.shadowJar
    group = 'publishing'
    description = 'Uploads the NeoForge jar to CurseForge'
    apiToken = curseApiKey ?: ""

    def mainFile = upload('622165', tasks.shadowJar)
    mainFile.displayName = releaseDisplayName
    mainFile.releaseType = release_type
    mainFile.changelog = releaseChangelog
    mainFile.changelogType = 'markdown'
    mainFile.addGameVersion(minecraft_version)
    mainFile.addModLoader('neoforge')
    mainFile.addEnvironment('client')

    onlyIf { curseApiKey != null }
}

modrinth {
    token = modrinthToken ?: ""
    projectId = 'nnu4dJj4'
    versionNumber = "${rootProject.version}"
    versionName = releaseDisplayName
    versionType = release_type
    changelog = releaseChangelog
    uploadFile = tasks.shadowJar
    gameVersions = [minecraft_version]
    loaders = ['neoforge']
}

tasks.named('modrinth') {
    onlyIf { modrinthToken != null }
}
