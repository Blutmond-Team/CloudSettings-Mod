name: 26.1.2 Build Tests

on:
  push:
    branches: [ "26.1.2" ]
  pull_request:
    branches: [ "26.1.2" ]

permissions:
  contents: read

jobs:
  build-with-java-25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: "26.1.2"
      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build with Gradle
        uses: gradle/gradle-build-action@67421db6bd0bf253fb4bd25b31ebb98943c375e1
        with:
          arguments: build
      - name: 'Upload NeoForge Artifact'
        uses: actions/upload-artifact@v3
        with:
          name: NeoForge Mod
          path: build/libs/CloudSettings-26.1.2-*.*.*.*-neoforge.jar
      - name: 'Upload Fabric Artifact'
        uses: actions/upload-artifact@v3
        with:
          name: Fabric Mod
          path: build/libs/CloudSettings-26.1.2-*.*.*.*-fabric.jar
